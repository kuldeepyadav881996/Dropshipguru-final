<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0E1013">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Payment Status — DropshipGuru</title>
<style>
  :root {
    --bg: #0E1013;
    --card: #16191E;
    --gold: #D4AF37;
    --text: #EDEFF2;
    --muted: #9AA1AC;
    --ok: #2FBF71;
    --fail: #E5484D;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  .card {
    width: 100%;
    max-width: 460px;
    padding: 40px 32px;
    border: 1px solid rgba(212, 175, 55, .22);
    border-radius: 16px;
    background: var(--card);
    text-align: center;
  }

  .mark {
    width: 64px;
    height: 64px;
    margin: 0 auto 20px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: 30px;
    border: 2px solid var(--gold);
  }

  .mark.spin {
    border-top-color: transparent;
    animation: spin 1s linear infinite;
  }

  .mark.ok   { border-color: var(--ok);   color: var(--ok); }
  .mark.fail { border-color: var(--fail); color: var(--fail); }

  @keyframes spin { to { transform: rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) {
    .mark.spin { animation: none; }
  }

  h1 { margin: 0 0 10px; font-size: 22px; letter-spacing: .2px; }

  p { margin: 0 0 8px; color: var(--muted); font-size: 15px; line-height: 1.6; }

  .ref {
    margin-top: 18px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    color: var(--muted);
    word-break: break-all;
  }

  .actions { margin-top: 26px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

  a.btn {
    display: inline-block;
    padding: 11px 22px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    border: 1px solid rgba(212, 175, 55, .5);
    color: var(--gold);
  }

  a.btn.primary { background: var(--gold); color: #0E1013; border-color: var(--gold); }
</style>
</head>
<body>
  <main class="card" role="status" aria-live="polite">
    <div class="mark spin" id="mark" aria-hidden="true"></div>
    <h1 id="title">Verifying your payment…</h1>
    <p id="detail">Please don’t close or refresh this page.</p>
    <p class="ref" id="ref"></p>
    <div class="actions" id="actions" hidden>
      <a class="btn primary" href="/">Back to DropshipGuru</a>
      <a class="btn" href="/contact/">Contact support</a>
    </div>
  </main>

<script src="phonepe-client.js"></script>
<script>
(function () {
  'use strict';

  var POLL_DELAYS_MS = [0, 2000, 3000, 5000, 8000, 10000];

  var mark = document.getElementById('mark');
  var title = document.getElementById('title');
  var detail = document.getElementById('detail');
  var ref = document.getElementById('ref');
  var actions = document.getElementById('actions');

  var merchantOrderId =
    new URLSearchParams(location.search).get('merchantOrderId') ||
    ((window.DropshipGuruPhonePe.readPendingOrder() || {}).merchantOrderId);

  if (merchantOrderId) {
    ref.textContent = 'Reference: ' + merchantOrderId;
  }

  function render(state, headline, message) {
    mark.className = 'mark ' + state;
    mark.textContent = state === 'ok' ? '✓' : state === 'fail' ? '✕' : '';
    title.textContent = headline;
    detail.textContent = message;
    actions.hidden = false;
  }

  function finishSuccess() {
    window.DropshipGuruPhonePe.clearPendingOrder();
    render(
      'ok',
      'Payment successful',
      'Thank you! Your payment is confirmed and our team will reach out to you shortly.'
    );
  }

  function finishFailure(message) {
    window.DropshipGuruPhonePe.clearPendingOrder();
    render('fail', 'Payment not completed', message);
  }

  function attempt(index) {
    // Only the backend can decide this — it queries the PhonePe Order Status
    // API. Returning to this page is never treated as proof of payment.
    window.DropshipGuruPhonePe.confirmPayment(merchantOrderId)
      .then(function (result) {
        if (result.paid) {
          finishSuccess();
          return;
        }

        if (!result.pending) {
          finishFailure(
            'PhonePe reported that this payment did not go through. ' +
            'Any amount debited will be refunded automatically.'
          );
          return;
        }

        var next = index + 1;

        if (next >= POLL_DELAYS_MS.length) {
          render(
            'fail',
            'Payment still processing',
            'PhonePe has not confirmed this payment yet. Please do not pay again — ' +
            'contact us with the reference below and we will verify it for you.'
          );
          return;
        }

        detail.textContent = 'Still confirming with PhonePe…';
        setTimeout(function () { attempt(next); }, POLL_DELAYS_MS[next]);
      })
      .catch(function (err) {
        render(
          'fail',
          'Could not verify payment',
          (err && err.message) ||
          'We could not reach our servers. Please contact us with the reference below.'
        );
      });
  }

  if (!merchantOrderId) {
    finishFailure('No payment reference was found for this session.');
  } else {
    attempt(0);
  }
})();
</script>
</body>
</html>
